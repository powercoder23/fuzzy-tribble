# LEAN MODE (2026-08-06): every trading strategy except iv-percentile was
# removed outright (files, services, tests) — discount, break-bounce,
# momentum, iv-seller, iv-rank, oi-buildup, gap-scan, delivery-surge,
# smart-money, sonar, composite. `docker-compose up -d` now brings up exactly
# four services: iv-collector, iv-percentile, market-context, dashboard.
# Recover any of the removed strategies from git history if needed.
#
# discount.py itself survives (not a compose service any more) because
# iv_percentile_strategy.py depends on DiscountedPremiumScanner /
# unwrap_dhan_payload for option-chain fetch, ATM detection and execution
# pricing — it is shared broker/pricing infrastructure, not just the
# discount strategy's own logic. Its strategy-tuning config, discount_config.py,
# was still deleted; paper_trader.py falls back to built-in defaults when it's
# absent (see the try/except around that import).
#
# The paper-book admission guarantee is paper_policy.py, enforced at the
# single INSERT into paper_trades: PAPER_STRATEGY_ALLOWLIST (default "IV_",
# matching iv-percentile's IV_SELL_STRANGLE / IV_BUY_CE / IV_BUY_PE tags)
# refuses any other strategy regardless of which container is alive. `docker-
# compose down` (or stop/rm the specific container) before changing gating —
# `restart: unless-stopped` keeps an already-running container trading even
# after its profile/definition changes.

services:

  # ── IV Collector ────────────────────────────────────────────────────────
  # Must start first. Sole writer of iv_history rows — every strategy reads
  # IV data through it.
  iv-collector:
    build:
      context: .
      dockerfile: Dockerfile.iv-collector
    container_name: iv-collector
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Kolkata
      APP_TIMEZONE: Asia/Kolkata
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
    command: python -m collectors.iv_collector_service

  # ── IV Percentile Strategy ─────────────────────────────────────────────
  # 60-day IV history mean-reversion: IV >= 85th pct -> sell strangle,
  # IV <= 15th pct -> buy option. Books into the shared paper book via
  # OrderManager.submit_external_signal, tagged IV_SELL_STRANGLE / IV_BUY_CE
  # / IV_BUY_PE. Configuration lives in iv_percentile_strategy.py itself
  # (IV_PERCENTILE_CONFIG), not env vars.
  iv-percentile:
    build: .
    container_name: iv-percentile-strategy
    command: python -m iv_percentile_runner
    depends_on: [iv-collector, dashboard]
    env_file: .env
    volumes: [./data:/app/data, ./logs:/app/logs]
    environment: [TZ=Asia/Kolkata]
    restart: unless-stopped

  # ── Market Context ────────────────────────────────────────────────────
  # Shared market description. Owns the ONLY WebSocket connection in the
  # platform and is the SOLE WRITER of the mc_* tables in
  # data/market_context.db (separate file from iv_history.db on purpose —
  # that DB is ~315 MB and written continuously by iv-collector).
  #
  # PHASE 1 — OBSERVATIONAL ONLY. Does not veto entries, change exits,
  # stop-losses, targets or sizing. Collects and persists so the effect of
  # market context on expectancy can be MEASURED before it is ever allowed
  # to influence a decision. See MARKET_CONTEXT_PLAN.md Rev 2.
  market-context:
    build:
      context: .
      dockerfile: Dockerfile.market-context
    container_name: market-context
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Kolkata
      APP_TIMEZONE: Asia/Kolkata
      # off | observe. "soft"/"hard" are reserved and NOT implemented — a
      # mis-set value degrades to observe rather than influencing trades.
      MC_MODE: observe
      # auto | standard | plus. "auto" probes the connection allowance at
      # startup and scales the universe: standard -> NIFTY/BANKNIFTY/VIX +
      # ~59 liquid stocks; plus -> the full monitored universe.
      MC_PLAN_TIER: auto
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      # Needs the liquid-universe ranking (OI x volume) that iv-collector's
      # snapshots provide, to pick the tier-3/4 constituents each morning.
      - iv-collector
    command: python -m market_context.service

  # ── Dashboard ─────────────────────────────────────────────────────────────
  # Web dashboard — IV graph, paper trade P&L, universe overview.
  # Access via Tailscale: http://<nas-ip>:8050
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: trading-dashboard
    restart: unless-stopped
    ports:
      - "8050:8050"
    volumes:
      - ./data:/app/data
      # Settings page container controls (start/stop/restart/rebuild) proxy
      # to the host daemon over this socket — see docker_control.py.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only access to this compose file + build contexts.
      - .:/compose:ro
    env_file:
      - .env
