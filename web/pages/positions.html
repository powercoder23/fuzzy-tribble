<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuzzy Tribble — Positions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/shell.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page">
        <div class="stat-row" id="statRow"></div>
        <div class="card" id="tradesCard"><div class="loading">Loading…</div></div>
        <div class="card" style="margin-top:var(--s5)">
          <div class="card-head"><div><div class="card-title">P&amp;L Over Time</div><div class="card-sub">Click a bar to see that day's trades</div></div></div>
          <div style="height:220px"><canvas id="pnlChart"></canvas></div>
        </div>
      </main>
    </div>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>
  <div class="scrim" id="scrim"></div>
  <script type="module" src="/static/js/pages/positions.js"></script>
</body>
</html>
